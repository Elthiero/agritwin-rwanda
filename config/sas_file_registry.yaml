# Maps year -> season -> file role -> actual raw filename in data/raw/sas/{year}/.
# Filenames are inconsistent across years (different naming conventions, casing,
# spacing) so this registry is the single place that knows the real names.
# Confirmed by directory listing during /audit-sas for each year. Do not guess;
# re-run /audit-sas if a year's filenames change after a re-download.
#
# File roles:
#   production: crop-level rows (multiple rows per plot for multi-crop plots)
#   practice:   plot-level rows (erosion, land consolidation, mechanization, irrigation)
#   fertilizer: plot-level rows (organic/inorganic fertilizer, pesticide)

2019:
  A:
    production: "rwa-sas-seasonA_Crop production.sav"
    practice: "rwa-sas-SeasonA_PartIV_Agricultural practice.sav"
    fertilizer: "rwa-sas-SeasonA_PartIII_Fertilizers_Pesticides.sav"
  B:
    production: "rwa-sas-seasonB_Crop production.sav"
    practice: "rwa-sas-SeasonB_PartIV_Agricultural practice.sav"
    fertilizer: "rwa-sas-SeasonB_PartIII_Fertilizers_Pesticides.sav"

