# canonical_name: {source, confidence, note} per year and file type.
# source: a column name (str), a list of columns (list, OR'd for booleans), or null (not collected).
# confidence: high | low. low means the mapping is indirect or inferred; harmonize.py must
#   carry this forward as metadata (see stg_sas_variable_confidence.parquet), not drop the column.
# note: optional, free text.
# 2024 production names confirmed by /audit-sas from the raw .dta column labels directly
# (catalog 113): Season A and Season B production files share the identical instrument,
# same column names and labels for every canonical variable. All other years filled by /audit-sas.
# Do not guess. All canonical variable names must match exactly across years.
2024:
  production:
    segment_id: {source: Segment_ID, confidence: high}
    province_code: {source: s1q1, confidence: high}
    district_code: {source: s1q2, confidence: high}
    stratum: {source: s1q3, confidence: high}
    segment_no: {source: s1q4, confidence: high}
    farmer_id: {source: s1q6, confidence: high}
    farmer_type: {source: s1q7, confidence: high}
    plot_id: {source: s2q1, confidence: high}
    plot_area_sqm: {source: s2q2, confidence: high}
    n_main_crops: {source: s2q3, confidence: high}
    crop_code_src: {source: s2q4, confidence: high}
    sowing_date: {source: s2q7, confidence: high}
    improved_seed: {source: s2q9, confidence: high}
    harvest_kg_plot: {source: s2q21, confidence: high, note: "total for all crops on plot"}
    harvest_kg_crop: {source: s2q22, confidence: high, note: "NOT used for canonical harvest_kg (see decisions.md 2026-09-23): cross-tab shows s2q22 systematically exceeds s2q21, consistent with s2q22 capturing projected/expected production rather than actual harvest. harvest_kg always sources from s2q21."}
    qty_lost_kg: {source: s2q39, confidence: high, note: "total loss after harvest"}
    organic_fert: {source: s3q3, confidence: high}
    inorganic_fert: {source: s3q9, confidence: high}
    pesticide: {source: s3q19, confidence: high}
    erosion_degree: {source: s4q1, confidence: high}
    anti_erosion: {source: s4q3, confidence: high}
    land_consolidation: {source: s4q6, confidence: high}
    mechanized: {source: s4q9, confidence: high, note: "ask whether used mechanical equipment on plot"}
    irrigated: {source: s4q15, confidence: high}
    interview_date: {source: s5q12, confidence: high}
    weight: {source: plot_weight, confidence: high, note: "plot-level weight"}
