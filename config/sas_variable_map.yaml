# canonical_name: source column per year and file type.
# Every mapping includes explicit confidence level: high, medium, low.
# 2024 production names confirmed by /audit-sas from the raw .dta column labels directly
# (catalog 113): Season A and Season B production files share the identical instrument,
# same column names and labels for every canonical variable. All other years filled by /audit-sas.
# Do not guess. All variable names must match exactly across years.
2024:
  production:
    segment_id: Segment_ID  # confidence: high
    province_code: s1q1  # confidence: high
    district_code: s1q2  # confidence: high
    stratum: s1q3  # confidence: high
    segment_no: s1q4  # confidence: high
    farmer_id: s1q6  # confidence: high
    farmer_type: s1q7  # confidence: high
    plot_id: s2q1  # confidence: high
    plot_area_sqm: s2q2  # confidence: high
    n_main_crops: s2q3  # confidence: high
    crop_code_src: s2q4  # confidence: high
    sowing_date: s2q7  # confidence: high
    improved_seed: s2q9  # confidence: high
    harvest_kg_plot: s2q21  # confidence: high, note: total for all crops on plot
    harvest_kg_crop: s2q22  # confidence: high, note: crop-specific harvest; use for pure-stand plots
    qty_lost_kg: s2q39  # confidence: high, note: total loss after harvest
    organic_fert: s3q3  # confidence: high
    inorganic_fert: s3q9  # confidence: high
    pesticide: s3q19  # confidence: high
    erosion_degree: s4q1  # confidence: high
    anti_erosion: s4q3  # confidence: high
    land_consolidation: s4q6  # confidence: high
    mechanized: s4q9  # confidence: high, note: ask whether used mechanical equipment on plot
    irrigated: s4q15  # confidence: high
    interview_date: s5q12  # confidence: high
    weight: plot_weight  # confidence: high, note: plot-level weight
