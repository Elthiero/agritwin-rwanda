services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    ports: ["8000:8000"]
    volumes:
      - ./data/public:/app/data/public:ro
    environment:
      - DATA_DIR=/app/data
      - API_ALLOWED_ORIGINS=http://localhost:5173
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
      args:
        VITE_API_BASE: http://localhost:8000/api/v1
    ports: ["5173:80"]
    depends_on: [api]
